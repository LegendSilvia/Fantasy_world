name: broadcast

# The daily broadcast (sub-project 6): the world lives one more year and the episode is published, at 05:30 in
# Bangkok every morning. GitHub runs scheduled workflows only from the default branch, and may start them late.
#
# Three stages (sub-project 7 F2): `prepare` builds and narrates the episode and plans its film, posting nothing; `film`
# films the episode on the game's diorama, one stretch per machine at the same time; `publish` joins the film with the
# narration (or, if a stretch was not filmed, pans over the map instead), uploads it to YouTube and posts to Discord.
on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Work under staging/ and post to the test Discord channel'
        type: boolean
        default: true
      create:
        description: 'Begin a new world if none is stored (a scheduled run never does)'
        type: boolean
        default: false
      upload-unlisted:
        description: 'With dry-run: upload the staging video to YouTube as unlisted (a link to share, not listed on the channel)'
        type: boolean
        default: false

# One run at a time, and a run in progress is never cancelled: two runs must not touch the world together.
concurrency:
  group: broadcast
  cancel-in-progress: false

permissions:
  contents: read

env:
  DRY_RUN: ${{ inputs.dry-run }}
  CREATE: ${{ inputs.create }}
  UPLOAD_UNLISTED: ${{ inputs.upload-unlisted }}
  REF: ${{ github.ref }}
  DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build sim/FantasyWorld.Broadcast --configuration Release
      - name: Build and narrate the episode, and plan its film
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # The face-offs' portraits and banners (FLUX); without it, the cards show only images already kept.
          FLUX_ACCESS_KEY: ${{ secrets.FLUX_ACCESS_KEY }}
          # The webhook is needed to know a post is possible; nothing is posted at this stage.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "$DEFAULT_REF" ]; then
            echo "error: the live broadcast runs only from the default branch; tick dry-run to try a branch."
            exit 1
          fi
          args=(run --config broadcast.json --prepare "$RUNNER_TEMP/plan.json")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$CREATE" = "true" ]; then args+=(--create); fi
          dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- "${args[@]}"
      - name: Fetch the day's video for the run's artifacts
        if: always() && env.PLAN != ''
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          prefix=$(jq -r .prefix <<< "$PLAN"); date=$(jq -r .date <<< "$PLAN")
          fw() { dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- "$@"; }
          mkdir -p "$RUNNER_TEMP/video"
          for name in episode.mp4 short.mp4 thumbnail.jpg script.txt; do
            fw get "${prefix}episodes/$date/$name" "$RUNNER_TEMP/video/$date-$name" || echo "No $name for $date."
          done
      - name: Keep the day's video with the run (download it from the run's page)
        if: always() && env.PLAN != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: episode-video
          path: ${{ runner.temp }}/video/
          retention-days: 7
          if-no-files-found: ignore
      - name: Hand the plan to the film jobs
        id: plan
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/plan.json" ]; then
            echo "plan=$(jq -c . "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
            echo "chunks=$(jq -c '[.chunks[].index]' "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          else
            echo "chunks=[]" >> "$GITHUB_OUTPUT"
          fi

  film:
    needs: prepare
    if: needs.prepare.outputs.chunks != '' && needs.prepare.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    # About two seconds a frame at 1080p: a 12-second stretch films in ~10 minutes, plus ~2 for the setup.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.prepare.outputs.chunks) }}
        # Each stretch is filmed wide (the episode's video) and tall (the vertical short, 1080×1920; the owner, 2026-10-28).
        shape: [wide, tall]
    env:
      PLAN: ${{ needs.prepare.outputs.plan }}
      CHUNK: ${{ matrix.chunk }}
      SHAPE: ${{ matrix.shape }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install a virtual display, software Vulkan and ffmpeg
        # Bounded and tried twice (see the script): one hung install once cost a whole film.
        timeout-minutes: 12
        run: .github/scripts/apt-install.sh xvfb mesa-vulkan-drivers libgl1-mesa-dri ffmpeg
      - name: Install Godot 4.3 (.NET)
        run: |
          curl -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build
        run: |
          dotnet build sim/FantasyWorld.Broadcast --configuration Release
          dotnet build game/FantasyWorld.Game.csproj
          timeout 300 "$GODOT" --headless --path game --import
      - name: Fetch the day's world and shots
        run: |
          prefix=$(jq -r .prefix <<< "$PLAN"); date=$(jq -r .date <<< "$PLAN")
          world=$(jq -r '.worldKey // "world.fw.db"' broadcast.json)
          fw() { dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- "$@"; }
          fw get "$prefix$world" "$RUNNER_TEMP/world.fw.db"
          fw get "${prefix}episodes/$date/film/shots.json" "$RUNNER_TEMP/shots.json"
          # The images the shots name (face-off portraits and banners, fights' stills); one that cannot be fetched is only left out.
          mkdir -p "$RUNNER_TEMP/images"
          for key in $(jq -r '[.[] | (.faceOff // empty | .a.image, .b.image), .still] | map(select(. != null)) | unique | .[]' "$RUNNER_TEMP/shots.json"); do
            fw get "$prefix$key" "$RUNNER_TEMP/images/$(basename "$key")" || echo "warning: $key could not be fetched."
          done
      - name: Film the stretch on the diorama
        timeout-minutes: 25
        run: |
          from=$(jq -r ".chunks[] | select(.index == $CHUNK) | .from" <<< "$PLAN")
          to=$(jq -r ".chunks[] | select(.index == $CHUNK) | .to" <<< "$PLAN")
          if [ "$SHAPE" = "tall" ]; then
            if [ "$(jq -r '.youTube.shorts // true' broadcast.json)" != "true" ]; then echo "No shorts; the tall stretch is not filmed."; exit 0; fi
            size=1080x1920; extra=(--vertical)
          else
            size=1920x1080; extra=()
          fi
          echo "Filming stretch $CHUNK ($SHAPE, $size): $from–$to s."
          timeout 1400 xvfb-run -a -s "-screen 0 ${size}x24" "$GODOT" --path game \
            --rendering-driver vulkan --rendering-method forward_plus --resolution "$size" --fixed-fps 24 \
            res://film/Film.tscn -- --world "$RUNNER_TEMP/world.fw.db" --shots "$RUNNER_TEMP/shots.json" \
            --images "$RUNNER_TEMP/images" --from "$from" --to "$to" --fps 24 --frames "$RUNNER_TEMP/frames" "${extra[@]}"
      - name: Encode and store the stretch
        run: |
          if [ ! -d "$RUNNER_TEMP/frames" ]; then echo "Nothing filmed."; exit 0; fi
          prefix=$(jq -r .prefix <<< "$PLAN"); date=$(jq -r .date <<< "$PLAN")
          # Every stretch is encoded alike, so they join without being encoded again.
          ffmpeg -hide_banner -nostdin -loglevel error -y -framerate 24 -i "$RUNNER_TEMP/frames/frame%06d.png" \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -r 24 "$RUNNER_TEMP/chunk.mp4"
          name=$(printf 'chunk-%02d.mp4' "$CHUNK"); if [ "$SHAPE" = "tall" ]; then name="tall-$name"; fi
          dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- \
            put "$RUNNER_TEMP/chunk.mp4" "${prefix}episodes/$date/film/$name"
          echo "Stored $name ($(du -h "$RUNNER_TEMP/chunk.mp4" | cut -f1))."

  site:
    # The world in a browser (sub-project 11): the viewer app and the day's world, deployed to Cloudflare Pages while the
    # film is being made. A dry run deploys to the project's staging branch, so the public site changes only when live.
    # Skipped until the CLOUDFLARE_API_TOKEN secret (Pages: Edit) exists; a failure here never stops the broadcast.
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Is there a Pages token?
        id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "No CLOUDFLARE_API_TOKEN secret: the website is not deployed."; fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ready == 'true'
      - uses: actions/setup-dotnet@v4
        if: steps.token.outputs.ready == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Build the viewer and fetch the day's world
        id: build
        if: steps.token.outputs.ready == 'true'
        run: |
          dotnet publish sim/FantasyWorld.Web --configuration Release --output "$RUNNER_TEMP/site"
          if [ "$DRY_RUN" = "true" ]; then prefix=$(jq -r .stagingPrefix broadcast.json); else prefix=$(jq -r .livePrefix broadcast.json); fi
          bundle="$RUNNER_TEMP/site/wwwroot/world.json.gz"
          if ! dotnet run --configuration Release --project sim/FantasyWorld.Broadcast -- get "${prefix}web/world.json.gz" "$bundle"; then
            # A day's episode made before the website existed has no bundle: make one from the stored world (only read).
            echo "No stored bundle for the day; exporting one from the stored world."
            world=$(jq -r '.worldKey // "world.fw.db"' broadcast.json)
            dotnet run --configuration Release --project sim/FantasyWorld.Broadcast -- get "$prefix$world" "$RUNNER_TEMP/world.fw.db"
            dotnet run --configuration Release --project sim/FantasyWorld.Cli -- export-web "$RUNNER_TEMP/world.fw.db" "$bundle"
          fi
          # The website's images (the owner, 2026-10-29): realms' banners, beasts, duellists; copied beside the viewer, listed in images.json.
          pictures="$RUNNER_TEMP/site/wwwroot/pictures"
          mkdir -p "$pictures" && echo '{}' > "$RUNNER_TEMP/site/wwwroot/images.json"
          if dotnet run --configuration Release --project sim/FantasyWorld.Broadcast -- get "${prefix}web/images.json" "$RUNNER_TEMP/images.json"; then
            for ref in $(jq -r 'keys[]' "$RUNNER_TEMP/images.json"); do
              key=$(jq -r --arg r "$ref" '.[$r]' "$RUNNER_TEMP/images.json"); file="${ref//#/-}.png"
              if dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- get "$prefix$key" "$pictures/$file"; then
                jq --arg r "$ref" --arg f "pictures/$file" '.[$r] = $f' "$RUNNER_TEMP/site/wwwroot/images.json" > "$RUNNER_TEMP/b.json" \
                  && mv "$RUNNER_TEMP/b.json" "$RUNNER_TEMP/site/wwwroot/images.json"
              fi
            done
          else
            echo "No images stored for the day: the website goes without them."
          fi
          # The prayers' Pages Functions (sub-project 13 N5) deploy from site/, with the viewer copied into it.
          rm -rf site/public && cp -r "$RUNNER_TEMP/site/wwwroot" site/public
          echo "project=$(jq -r '.site.project // "fantasy-world-chronicle"' broadcast.json)" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then echo "branch=staging" >> "$GITHUB_OUTPUT"; else echo "branch=main" >> "$GITHUB_OUTPUT"; fi
      - name: Create the Pages project (once; already there is fine)
        if: steps.token.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages project create ${{ steps.build.outputs.project }} --production-branch=main
      - name: Deploy the site, with the players' prayers
        id: deploy
        if: steps.token.outputs.ready == 'true'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          workingDirectory: site
          command: pages deploy --project-name=${{ steps.build.outputs.project }} --branch=${{ steps.build.outputs.branch }} --commit-dirty=true
      - name: Deploy the site without the prayers (the token cannot bind their database)
        id: plain
        if: steps.token.outputs.ready == 'true' && steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.R2_ACCOUNT_ID }}
          command: pages deploy ${{ runner.temp }}/site/wwwroot --project-name=${{ steps.build.outputs.project }} --branch=${{ steps.build.outputs.branch }} --commit-dirty=true
      - name: Say where it is
        if: steps.token.outputs.ready == 'true'
        env:
          URL: ${{ steps.deploy.outputs.deployment-url || steps.plain.outputs.deployment-url }}
        run: echo "The world is at $URL (set site.url in broadcast.json to link to it from the posts)."

  publish:
    needs: [prepare, film]
    # After the film jobs, whatever became of them: a stretch not filmed only means the map pans instead.
    if: always() && needs.prepare.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The video is made every day (uploaded to YouTube only with its secrets), so ffmpeg is always installed.
      MAKES_VIDEO: 'true'
      PLAN: ${{ needs.prepare.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build sim/FantasyWorld.Broadcast --configuration Release
      - name: Install ffmpeg (for the YouTube video)
        if: env.MAKES_VIDEO == 'true'
        # A failed or slow install costs only the video; the broadcast itself must still run.
        continue-on-error: true
        timeout-minutes: 10
        run: command -v ffmpeg || .github/scripts/apt-install.sh ffmpeg
      - name: Broadcast
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_TEST_WEBHOOK_URL: ${{ secrets.DISCORD_TEST_WEBHOOK_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          if [ "$DRY_RUN" != "true" ] && [ "$REF" != "$DEFAULT_REF" ]; then
            echo "error: the live broadcast runs only from the default branch; tick dry-run to try a branch."
            exit 1
          fi
          args=(run --config broadcast.json)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ "$DRY_RUN" = "true" ] && [ "$UPLOAD_UNLISTED" = "true" ]; then args+=(--upload-unlisted); fi
          if [ "$CREATE" = "true" ]; then args+=(--create); fi
          dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- "${args[@]}"
      - name: Fetch the day's video for the run's artifacts
        if: always() && env.PLAN != ''
        continue-on-error: true
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          prefix=$(jq -r .prefix <<< "$PLAN"); date=$(jq -r .date <<< "$PLAN")
          fw() { dotnet run --no-build --configuration Release --project sim/FantasyWorld.Broadcast -- "$@"; }
          mkdir -p "$RUNNER_TEMP/video"
          for name in episode.mp4 short.mp4 thumbnail.jpg script.txt; do
            fw get "${prefix}episodes/$date/$name" "$RUNNER_TEMP/video/$date-$name" || echo "No $name for $date."
          done
      - name: Keep the day's video with the run (download it from the run's page)
        if: always() && env.PLAN != ''
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: episode-video
          path: ${{ runner.temp }}/video/
          retention-days: 7
          if-no-files-found: ignore

  # GitHub turns off the schedule of a public repository after 60 days without activity: the first scheduled run of
  # each month (Bangkok time) commits a one-line heartbeat, unless broadcast.json turns keepAlive off. A month whose
  # heartbeat failed is caught up by the next morning's run.
  keep-alive:
    needs: publish
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Monthly heartbeat
        run: |
          month="$(TZ=Asia/Bangkok date +%Y-%m)"
          if [ "$(jq -r .keepAlive broadcast.json)" != "true" ] || [ "$(cat .github/broadcast-heartbeat 2>/dev/null)" = "$month" ]; then
            echo "No heartbeat needed."
            exit 0
          fi
          echo "$month" > .github/broadcast-heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/broadcast-heartbeat
          git commit -m "chore: broadcast keep-alive [skip ci]" || exit 0
          git push || (git pull --rebase -q && git push)
