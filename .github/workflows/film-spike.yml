name: film-spike

# Episode film (sub-project 7), spike: how fast can GitHub's runners (no GPU) render the diorama? Films the war movie at
# 1280x720, 24 fps, as PNG frames under a virtual display, with each software renderer, and reports seconds per frame.
# Runs when this file is pushed on the broadcast branch; it touches no secret and no bucket. (Run 1 compared OpenGL
# compatibility, 0.72 s a frame, with Vulkan, 0.46 s; Vulkan also looked better, so only Vulkan is filmed now.)
on:
  push:
    branches: [ccr-81a7454e-12gx87]
    paths: [.github/workflows/film-spike.yml]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        renderer:
          - { name: vulkan, args: '--rendering-driver vulkan --rendering-method forward_plus' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install a virtual display and software renderers
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_SUSPEND: '1'
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends xvfb mesa-vulkan-drivers libgl1-mesa-dri
      - name: Install Godot 4.3 (.NET)
        run: |
          curl -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build the game
        run: dotnet build game/FantasyWorld.Game.csproj
      - name: Import assets
        run: timeout 300 "$GODOT" --headless --path game --import
      - name: Film the war movie (${{ matrix.renderer.name }})
        continue-on-error: true
        timeout-minutes: 25
        run: |
          mkdir -p "$RUNNER_TEMP/frames"
          start=$(date +%s)
          timeout 1400 xvfb-run -a -s "-screen 0 1280x720x24" "$GODOT" --path game ${{ matrix.renderer.args }} \
            --resolution 1280x720 --fixed-fps 24 --write-movie "$RUNNER_TEMP/frames/frame.png" res://tests/WarMovie.tscn 2>&1 | tail -n 30
          echo "exit: ${PIPESTATUS[0]}; wall: $(( $(date +%s) - start )) s"
      - name: Report
        if: always()
        run: |
          cd "$RUNNER_TEMP/frames" 2>/dev/null || { echo "no frames"; exit 0; }
          # Frames before the diorama appears (the world being built) and after the movie ends are blank, tiny PNGs: they
          # render almost instantly, so the speed is measured over the real frames only, and the samples come from them.
          python3 - "$RUNNER_TEMP/sample" <<'PY'
          import os, shutil, sys
          frames = sorted(f for f in os.listdir('.') if f.startswith('frame') and f.endswith('.png'))
          real = [f for f in frames if os.path.getsize(f) > 20_000]
          print(f"frames: {len(frames)}, of which real (not blank): {len(real)}")
          if len(real) < 2: sys.exit(0)
          span = os.path.getmtime(real[-1]) - os.path.getmtime(real[0])
          per = span / (len(real) - 1)
          print(f"render span: {span:.0f} s for {len(real) - 1} real frames; seconds per frame: {per:.3f}; "
                f"a 4-minute film at 24 fps: {per * 5760 / 60:.1f} min")
          os.makedirs(sys.argv[1], exist_ok=True)
          for f in (real[0], real[len(real) // 2], real[-1]): shutil.copy(f, sys.argv[1])
          PY
          du -sh .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frames-${{ matrix.renderer.name }}
          path: ${{ runner.temp }}/sample
          if-no-files-found: ignore
