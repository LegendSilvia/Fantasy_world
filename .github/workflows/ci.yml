name: ci

# Every push and pull request must pass all of these before it is merged (the owner, 2026-10-30: the repository is
# shared, so CI is strict). Pull requests from forks get no secrets: nothing here needs any.
on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      # Warnings are errors (Directory.Build.props); the build is checked on its own so its errors read plainly.
      - name: Build
        run: dotnet build sim/FantasyWorld.sln --configuration Release
      - name: Test
        run: dotnet test sim/FantasyWorld.Sim.Tests --configuration Release --no-build

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Code is formatted (run 'dotnet format sim/FantasyWorld.sln' to fix)
        run: dotnet format sim/FantasyWorld.sln --verify-no-changes

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: No package with a known vulnerability, direct or transitive
        run: |
          dotnet restore sim/FantasyWorld.sln
          out=$(dotnet list sim/FantasyWorld.sln package --vulnerable --include-transitive 2>&1)
          echo "$out"
          if echo "$out" | grep -q "has the following vulnerable packages"; then
            echo "::error::A package has a known vulnerability; update it."
            exit 1
          fi

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The website's scripts and functions parse
        run: |
          for f in $(git ls-files 'site/**/*.js' 'sim/FantasyWorld.Web/wwwroot/js/*.js'); do
            node --check "$f" || exit 1
          done
      - name: The workflows parse
        run: |
          for f in .github/workflows/*.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f" || exit 1
          done

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: No secret in the code or its history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Benchmark one world year (short job)
        run: dotnet run --configuration Release --project sim/FantasyWorld.Bench -- --filter '*' --job short

  game:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Godot 4.3 (.NET)
        run: |
          curl -sSLo "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_mono_linux_x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot_v4.3-stable_mono_linux_x86_64/Godot_v4.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
      - name: Build the game
        run: dotnet build game/FantasyWorld.Game.csproj
      - name: Import assets
        run: timeout 300 "$GODOT" --headless --path game --import
      - name: Headless checks (every screen, on a fresh tiny world)
        run: timeout 600 "$GODOT" --headless --path game res://tests/HeadlessChecks.tscn
