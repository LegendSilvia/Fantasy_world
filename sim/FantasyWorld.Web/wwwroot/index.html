<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chronicle</title>
    <base href="./" />
    <link rel="stylesheet" href="css/site.css" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="world"></canvas>
    <div id="labels"></div>

    <header id="bar">
        <div class="title">
            <div class="kicker">The Chronicle</div>
            <h1 id="name">Opening the world…</h1>
        </div>
        <button id="gods" class="gods" title="You are the gods: answer the world's prayers">✦ Prayers</button>
        <button id="people" class="gods" title="The world's notable people, most renowned first">☰ People</button>
        <button id="lore" class="gods" title="The world's legend, and the secrets uncovered so far">❧ Lore</button>
        <button id="chronicle" class="gods" title="Everything that happened in the year on the slider, by season and kind">☰ Chronicle</button>
        <button id="events" class="gods" title="World events: the demon lord, the heroes, and the fate of the world">✹ World events</button>
        <button id="wiki" class="gods" title="How the world works: races, classes, resources and everything else, by category">❖ Wiki</button>
        <label class="toggle"><input id="roads" type="checkbox" checked /> Trade roads</label>
        <label class="year">
            <span>Year <b id="year-label">–</b></span>
            <input id="year" type="range" min="1" max="1" value="1" disabled />
        </label>
        <button id="play" class="gods" title="Play the chronicle: each year's events, one after another, up to today">▶ Play</button>
    </header>

    <section id="ticker" hidden aria-live="polite"></section>

    <aside id="panel" hidden>
        <button id="back" aria-label="Back" title="Back to the last panel" hidden>‹ Back</button>
        <button id="close" aria-label="Close">×</button>
        <div id="panel-body"></div>
    </aside>

    <div id="loading">
        <div class="kicker">The Chronicle</div>
        <p id="loading-text">Waking the world…</p>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module" src="js/world.js"></script>
</body>

</html>
