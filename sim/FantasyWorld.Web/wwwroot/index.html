<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chronicle</title>
    <base href="./" />
    <link rel="stylesheet" href="css/site.css" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="world"></canvas>
    <div id="labels"></div>

    <header id="bar">
        <div class="title">
            <div class="kicker">The Chronicle</div>
            <h1 id="name">Opening the world…</h1>
        </div>
        <label class="year">
            <span>Year <b id="year-label">–</b></span>
            <input id="year" type="range" min="1" max="1" value="1" disabled />
        </label>
    </header>

    <aside id="panel" hidden>
        <button id="close" aria-label="Close">×</button>
        <div id="panel-body"></div>
    </aside>

    <div id="loading">
        <div class="kicker">The Chronicle</div>
        <p id="loading-text">Waking the world…</p>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module" src="js/world.js"></script>
</body>

</html>
