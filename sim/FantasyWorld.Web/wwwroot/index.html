<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Chronicle</title>
    <base href="./" />
    <link rel="stylesheet" href="css/site.css" />
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <canvas id="world"></canvas>
    <div id="labels"></div>
    <div class="turn" title="Turn the view: right-drag, Shift+drag or two fingers do it too">
        <button id="turn-left" aria-label="Turn left">⟲</button>
        <button id="turn-home" aria-label="Back to the first view">⌂</button>
        <button id="turn-right" aria-label="Turn right">⟳</button>
    </div>

    <header id="bar">
        <div class="title">
            <div class="kicker">The Chronicle</div>
            <h1 id="name">Opening the world…</h1>
        </div>
        <button id="gods" class="gods" title="You are the gods: answer the world's prayers">✦ Prayers</button>
        <button id="people" class="gods" title="The world's notable people, most renowned first">☰ People</button>
        <button id="lore" class="gods" title="The world's legend, and the secrets uncovered so far">❧ Lore</button>
        <button id="chronicle" class="gods" title="Everything that happened in the year on the slider, by season and kind">☰ Chronicle</button>
        <button id="events" class="gods" title="World events: the demon lord, the heroes, and the fate of the world">✹ World events</button>
        <button id="wiki" class="gods" title="How the world works: races, classes, resources and everything else, by category">❖ Wiki</button>
        <label class="toggle"><input id="roads" type="checkbox" checked /> Trade roads</label>
        <details id="markers" class="markers">
            <summary class="gods" title="Choose which markers the map shows">⚑ Filters<span id="markers-count"></span></summary>
            <div class="marker-list">
                <div class="marker-row"><label><input type="checkbox" data-layer="realms" checked /> Realms</label><a href="#" data-only="realms" title="Show only realms">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="towns" checked /> Towns</label><a href="#" data-only="towns" title="Show only towns">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="armies" checked /> Armies</label><a href="#" data-only="armies" title="Show only armies">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="characters" checked /> People</label><a href="#" data-only="characters" title="Show only people">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="beasts" checked /> Beasts</label><a href="#" data-only="beasts" title="Show only beasts">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="labyrinths" checked /> Labyrinths</label><a href="#" data-only="labyrinths" title="Show only labyrinths">only</a></div>
                <div class="marker-row"><label><input type="checkbox" data-layer="fights" checked /> Fights</label><a href="#" data-only="fights" title="Show only fights">only</a></div>
                <a href="#" id="markers-all" class="marker-all">Show all</a>
            </div>
        </details>
        <label class="year">
            <span>Year <b id="year-label">–</b></span>
            <input id="year" type="range" min="1" max="1" value="1" disabled />
        </label>
        <button id="play" class="gods" title="Play the chronicle: each year's events, one after another, up to today">▶ Play</button>
    </header>

    <section id="ticker" hidden aria-live="polite"></section>

    <aside id="panel" hidden>
        <button id="back" aria-label="Back" title="Back to the last panel" hidden>‹ Back</button>
        <button id="close" aria-label="Close">×</button>
        <div id="panel-body"></div>
    </aside>

    <div id="loading">
        <div class="kicker">The Chronicle</div>
        <p id="loading-text">Waking the world…</p>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module" src="js/world.js"></script>
</body>

</html>
