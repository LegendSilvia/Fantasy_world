# The website (sub-project 11) and its prayers (sub-project 13 N5): the broadcast's site job copies the built viewer into
# public/ and deploys this folder, so the Pages Functions in functions/ come with it, bound to the prayers' database.
name = "fantasy-world-chronicle"
pages_build_output_dir = "public"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding = "PRAYERS"
database_name = "fantasy-world-prayers"
database_id = "9e19ed08-7369-488f-84c8-9dd98df46ecd"
